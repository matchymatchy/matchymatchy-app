<style>

  .maps-hint{

  .result-card.clickable:hover .maps-hint, .result-card.clickable:focus-visible .maps-hint,

  input[type=range]{

  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px;height:20px; border-radius:50%;

  @media (prefers-reduced-motion: reduce){
    .pulse, .scan{ animation: none; }

  .mode-tabs{ display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px; }
  .mode-tabs::-webkit-scrollbar{ display:none; }
  .mode-tab{

  .pill-row{ display:flex; gap:8px; }

  .pill:active{ transform: scale(0.96); }
  .pill.selected{ border-color: var(--accent); background: rgba(255,107,91,0.14); color: var(--accent-2); }
  .pill:focus-visible{ outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .people-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;

  .timeline-item{ display:flex; gap:14px; }
  .timeline-track{ display:flex; flex-direction:column; align-items:center; }
  .timeline-dot{ width:11px;height:11px; border-radius:50%; background: var(--accent-2); margin-top:6px; flex-shrink:0; }

  .timeline-item:last-child .timeline-line{ display:none; }
  .timeline-content{ padding-bottom:22px; flex:1; }
  .timeline-time{ font-size:11.5px; font-weight:700; color: var(--accent-2); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:4px; }

  .hero-badge{
    display:inline-flex; align-items:center; gap:6px;
    background: rgba(255,200,87,0.12); border:1px solid rgba(255,200,87,0.3);
    color: var(--accent-2); font-size:11.5px; font-weight:700;
    padding:6px 12px; border-radius:100px; margin-bottom:16px;
  }
  .mode-cards{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .mode-card{
    display:flex; flex-direction:column; gap:5px;
    background: rgba(251,243,233,0.05); border:1px solid var(--line);

  }
  .mode-card:active{ transform: scale(0.98); }
  .mode-card:hover{ border-color: var(--accent); background: rgba(255,107,91,0.08); }
  .mode-card-top{ display:flex; align-items:center; gap:10px; }
  .mode-card-emoji{ font-size:19px; line-height:1; }
  .mode-card-title{ font-family:'Fraunces', serif; font-weight:600; font-size:16.5px; }
  .mode-card-arrow{ margin-left:auto; color: var(--muted); font-size:15px; }
  .mode-card-desc{ font-size:12.5px; color: var(--muted); line-height:1.45; margin:0; padding-left:29px; }

  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .top-bar .brand{ margin-bottom:0; }
  .fav-toggle{
    display:flex; align-items:center; gap:6px;

  .fav-btn{

  }
  .fav-btn.active{ background: rgba(255,107,91,0.18); color: var(--accent); }
  .fav-btn:active{ transform: scale(0.9); }

  .fav-empty{ color: var(--muted); font-size:14px; text-align:center; padding: 30px 0; }
  .fav-list-item{

  }
  .fav-list-item .fli-name{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; }
  .fav-list-item .fli-type{ font-size:12px; color: var(--muted); }

  @keyframes cardIn{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform: translateY(0);} }
  .mode-card{ animation: cardIn .45s ease both; }
  .mode-card:nth-child(1){ animation-delay: .02s; }
  .mode-card:nth-child(2){ animation-delay: .07s; }

<div class="phone">

<script>
/* =========================================================================
   KONFIG
   Sätt USE_LIVE_DATA till true och fyll i GOOGLE_MAPS_API_KEY när ni är
   redo att koppla på riktig platsdata. Resten av appen (UI, matchnings-
   poäng, rendering) behöver inte ändras — bara PlacesProvider.fetchLive
   nedan behöver en riktig implementation.
   ========================================================================= */
const CONFIG = {
  USE_LIVE_DATA: true,
  GOOGLE_MAPS_API_KEY: "AIzaSyAhrCLSTbf2flLPd7w965Xm-NqIoYPag7U"
};

/* =========================================================================
   PLACES PROVIDER
   Ett enda ställe som levererar platser till appen. Idag returnerar den
   fejkad data. Bytpunkten till Google Places API (New) är fetchLive().
   Formen på varje plats-objekt {name, type, price, dist, adv, tags, trait,
   lat, lng} är kontraktet resten av appen bygger på — håll live-datan i
   samma form så inget annat behöver ändras.
   ========================================================================= */
const PlacesProvider = (() => {

  // "slot" används bara av kvällsplans-läget (Ikväll) för att bygga en
  // rutt från förfest till efterfest. "rating"/"reviews" är exempeldata som
  // visas som ett litet recensionsbetyg på varje kort — se kommentaren vid
  // fetchLive() för hur det byts mot riktiga recensioner (t.ex. Google
  // Places har ett "rating"-fält redan inritat där).
  const MOCK_PLACES = [
    {name:"Barrio Nio", type:"Gatukökskrog · Sydamerikanskt", price:1, dist:0.8, adv:2, tags:["Prisvärt","Livlig stämning"], trait:"deras husgjorda chili-sås som stamgästerna pratar om", slot:"main", rating:4.6, reviews:312},
    {name:"Rök & Lin", type:"Bar · Naturviner", price:2, dist:1.6, adv:3, tags:["Mysigt","Bra för samtal"], trait:"en handplockad vinlista som byts varje vecka", slot:"late", rating:4.8, reviews:189},
    {name:"Höjden 12", type:"Takbar", price:3, dist:2.4, adv:4, tags:["Utsikt","Datevänligt"], trait:"panoramautsikt över hela stan från åttonde våningen", slot:"late", rating:4.4, reviews:501},
    {name:"Grus & Grönt", type:"Vegetariskt kök", price:2, dist:1.1, adv:2, tags:["Hälsosamt","Lugnt"], trait:"en meny som byggs helt efter dagens skörd", slot:"main", rating:4.7, reviews:96},
    {name:"Kajplats 4", type:"Fiskrestaurang · Hamnen", price:3, dist:3.2, adv:3, tags:["Romantiskt","Havsnära"], trait:"råvaror som kommer direkt från morgonens fångst", slot:"main", rating:4.5, reviews:220},
    {name:"Underjorden", type:"Speakeasy-bar", price:2, dist:2.0, adv:5, tags:["Hemlig entré","Äventyrligt"], trait:"en dold ingång bakom en gammal telefonkiosk", slot:"late", rating:4.9, reviews:143},
    {name:"Smulan", type:"Bakverk & kaffe", price:1, dist:0.5, adv:1, tags:["Prisvärt","Avslappnat"], trait:"kanelbullar som säljer slut innan lunch", slot:"early", rating:4.3, reviews:267},
    {name:"Fabriken 7", type:"Industribar · Craft beer", price:2, dist:2.8, adv:4, tags:["Högt i tak","Socialt"], trait:"tolv fatöl som bryggs i lokalen bakom disken", slot:"late", rating:4.6, reviews:178}
  ];

  // criteria: { coords: {lat,lng}|null, radiusKm, budget, adventure }
  async function fetchMock(criteria){
    // Simulerar nätverksfördröjning så "scannar"-steget känns äkta.
    await new Promise(r => setTimeout(r, 200));
    return MOCK_PLACES;
  }

  // Byt ut mot riktiga anrop när CONFIG.USE_LIVE_DATA = true.
  // Nedan är den faktiska formen på ett Places API (New) Nearby Search-
  // anrop, redo att aktiveras — kommenterad ut tills en nyckel finns på plats.
  async function fetchLive(criteria){
    if(!CONFIG.GOOGLE_MAPS_API_KEY){
      console.warn("matchymatchy: GOOGLE_MAPS_API_KEY saknas, faller tillbaka på fejkad data.");
      if(el.dataNote) el.dataNote.textContent = "Ingen Google-nyckel konfigurerad — visar exempeldata, avstånden är inte riktiga.";
      return fetchMock(criteria);
    }
    if(!criteria.coords){
      // Nearby Search kräver en position — om användaren hoppade över
      // "dela plats" har vi inget att söka runt, så vi faller tillbaka.
      // Detta syns nu tydligt för användaren (istället för att tyst visa
      // fejkade avstånd som om de vore riktiga) via dataNote-raden.
      console.warn("matchymatchy: ingen plats delad, faller tillbaka på fejkad data.");
      if(el.dataNote) el.dataNote.textContent = "Ingen plats delad — visar exempeldata, avstånden är inte riktiga.";
      return fetchMock(criteria);
    }

    const body = {
      // "includedTypes" matchar mot HELA platsens typ-lista, vilket är
      // varför t.ex. en saluhall (en marknad som har "restaurant" som en
      // av flera taggar, inte sin faktiska huvudkategori) kunde smyga sig
      // in som förslag. "includedPrimaryTypes" matchar bara mot platsens
      // FAKTISKA huvudkategori och är betydligt mer träffsäkert.
      includedPrimaryTypes: ["restaurant", "bar", "cafe"],
      // Snabbmat, matbutiker, boenden och bensinmackar klassas av Google
      // som egna primärtyper — utesluts helt här så de aldrig kan dyka upp
      // som förslag, oavsett vad poängsättningen längre ner skulle landa i.
      excludedPrimaryTypes: [
        "fast_food_restaurant", "meal_takeaway", "meal_delivery",
        "sandwich_shop", "food_court", "deli",
        "lodging", "hostel", "hotel", "motel", "resort_hotel", "campground", "rv_park",
        "gas_station", "convenience_store", "supermarket", "grocery_store",
        "department_store", "shopping_mall", "market"
      ],
      maxResultCount: 20,
      locationRestriction: {
        circle: {
          center: { latitude: criteria.coords.lat, longitude: criteria.coords.lng },
          radius: criteria.radiusKm * 1000
        }
      }
    };

    const res = await fetch("https://places.googleapis.com/v1/places:searchNearby", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": CONFIG.GOOGLE_MAPS_API_KEY,
        // FieldMask styr vad ni betalar för — håll den snäv.
        // OBS: "places.types" är en oordnad lista — det är INTE samma sak
        // som platsens huvudkategori. Vi hämtar "primaryType" separat
        // eftersom det är fältet Google faktiskt avsett för kategorisering
        // (se kommentar vid tidigare bugg i guessSlot/capitalizeType nedan).
        "X-Goog-FieldMask": "places.id,places.displayName,places.priceLevel,places.location,places.types,places.primaryType,places.primaryTypeDisplayName,places.rating,places.userRatingCount"
      },
      body: JSON.stringify(body)
    });

    if(!res.ok) throw new Error("Places API-anrop misslyckades: " + res.status);
    const data = await res.json();

    // Mappa Google-formatet till appens interna plats-form.
    return (data.places || [])
      .filter(p => isLegitRestaurantResult(p))
      .map(p => {
      // primaryType/primaryTypeDisplayName är Googles egna, avsedda fält för
      // "vad är det här stället egentligen" — till skillnad från "types",
      // som är en oordnad lista och INTE ska tolkas som types[0] = huvudtyp.
      // (Det var den bakomliggande buggen till att t.ex. snabbmatsställen
      // kunde hamna i fel kategori/tidslucka tidigare.)
      const typeLabel = p.primaryTypeDisplayName?.text || (p.primaryType ? capitalizeType(p.primaryType) : "");
      return {
        name: p.displayName?.text || "Okänt ställe",
        type: typeLabel,
        price: mapGooglePriceLevel(p.priceLevel),
        dist: haversineKm(criteria.coords, { lat: p.location.latitude, lng: p.location.longitude }),
        adv: 3, // Google har ingen "äventyrsnivå" — härled från types/rating vid behov
        tags: typeLabel ? [typeLabel] : [],
        trait: liveTrait(p),
        slot: guessSlot(p.primaryType),
        rating: typeof p.rating === "number" ? p.rating : null,
        reviews: p.userRatingCount || 0,
        lat: p.location.latitude,
        lng: p.location.longitude,
        placeId: p.id || null
      };
    });
  }

  // Extra säkerhetsnät utöver includedPrimaryTypes/excludedPrimaryTypes i
  // själva anropet: Googles typdata är inte alltid konsekvent (en kedja
  // kan t.ex. ibland vara taggad "restaurant" som huvudtyp trots att den
  // egentligen är snabbmat). Dubbelkollar därför primaryType mot samma
  // uteslutningslista lokalt, plus namnet mot kända snabbmatskedjor, så en
  // felmärkt träff ändå inte slinker igenom.
  const HARD_EXCLUDED_TYPES = new Set([
    "fast_food_restaurant", "meal_takeaway", "meal_delivery",
    "sandwich_shop", "food_court", "deli",
    "lodging", "hostel", "hotel", "motel", "resort_hotel", "campground", "rv_park",
    "gas_station", "convenience_store", "supermarket", "grocery_store",
    "department_store", "shopping_mall", "market"
  ]);
  const KNOWN_FAST_FOOD_NAMES = [
    "mcdonald", "max hamburgare", "burger king", "kfc", "sibylla",
    "subway", "taco bell", "o'learys", "pizza hut", "dominos", "domino's"
  ];
  function isLegitRestaurantResult(p){
    if(p.primaryType && HARD_EXCLUDED_TYPES.has(p.primaryType)) return false;
    const name = (p.displayName?.text || "").toLowerCase();
    if(KNOWN_FAST_FOOD_NAMES.some(n => name.includes(n))) return false;
    return true;
  }

  function mapGooglePriceLevel(level){
    // Fyra egna nivåer, en per Google-nivå — ingen ihopslagning längre.
    // Tidigare hamnade "dyrt" och "väldigt dyrt" i samma bucket (3), vilket
    // gjorde att budgetreglaget inte gick att lita på i den övre delen.
    const map = { PRICE_LEVEL_FREE:1, PRICE_LEVEL_INEXPENSIVE:1, PRICE_LEVEL_MODERATE:2, PRICE_LEVEL_EXPENSIVE:3, PRICE_LEVEL_VERY_EXPENSIVE:4 };
    return map[level] || 2;
  }

  function capitalizeType(type){
    const t = type.replaceAll("_"," ");
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  // Google skickar ingen färdig "känt för"-text, så vi bygger en kort
  // rad av det vi faktiskt har (betyg + antal recensioner) istället för
  // att lämna motiveringen tom för riktiga platser.
  function liveTrait(p){
    if(typeof p.rating === "number" && p.userRatingCount){
      return `ett snittbetyg på ${p.rating.toFixed(1)} från ${p.userRatingCount} recensioner`;
    }
    if(typeof p.rating === "number"){
      return `ett snittbetyg på ${p.rating.toFixed(1)} på Google`;
    }
    return "";
  }

  // "Ikväll"-läget (förfest/middag/efterfest) bygger på ett "slot"-fält som
  // Google inte har — vi gissar det grovt utifrån platstypen så det läget
  // fortsätter fungera med riktig data också.
  function guessSlot(primaryType){
    if(["cafe","bakery"].includes(primaryType)) return "early";
    if(["bar","night_club","pub","wine_bar"].includes(primaryType)) return "late";
    return "main";
  }

  function haversineKm(a, b){
    if(!a || !b) return 99;
    const R = 6371;
    const dLat = (b.lat-a.lat) * Math.PI/180;
    const dLng = (b.lng-a.lng) * Math.PI/180;
    const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }

  // Härleder om ett ställe serverar mat / alkohol / fika utifrån dess
  // typ-text och befintliga taggar — oavsett om det kommer från mockdata
  // eller Google Places (som bara ger en typ-etikett, t.ex. "Bar" eller
  // "Restaurant"). Det gör att en fritextvibe som "mat och bar" faktiskt
  // kan hitta — och prioritera — ställen som är BÅDA delarna, inte bara
  // ett av dem.
  function deriveCapabilityTags(p){
    const hay = ((p.type || "") + " " + (p.tags || []).join(" ")).toLowerCase();
    const extra = [];
    if(/restaurang|restaurant|kök|krog|matsal|bistro|grill|pizza|sushi|thai|asiat|italiensk|indisk|fisk|kebab|burgare|mat/.test(hay)) extra.push("Mat");
    if(/\bbar\b|pub|vin bar|vinbar|wine|öl|beer|cocktail|drink|speakeasy|nattklubb|night_club|brewery|bryggeri/.test(hay)) extra.push("Alkohol");
    if(/kaffe|fika|bakverk|café|cafe|bakery|kondis/.test(hay)) extra.push("Fika");
    return extra.filter(t => !(p.tags || []).includes(t));
  }

  async function getPlaces(criteria){
    const places = CONFIG.USE_LIVE_DATA ? await fetchLive(criteria) : await fetchMock(criteria);
    return places.map(p => ({ ...p, tags: [...(p.tags || []), ...deriveCapabilityTags(p)] }));
  }

  return { getPlaces };
})();

/* =========================================================================
   MATCHNINGSLOGIK
   Ren funktion: tar platser + kvizsvar, returnerar rankade matchningar.
   Oberoende av var platserna kom ifrån (mock eller live).
   ========================================================================= */
function scorePlace(p, state){
  const priceScore = 1 - (Math.abs(p.price - state.budget) / 3);
  const distScore = p.dist <= state.radius ? 1 : Math.max(0, 1 - ((p.dist - state.radius) / 2));
  const advScore = 1 - (Math.abs(p.adv - state.adventure) / 4);
  return priceScore*0.4 + distScore*0.35 + advScore*0.25;
}

// Ger bonuspoäng till platser vars taggar matchar en lista — används av
// t.ex. "Dejt"-läget (romantiska taggar) och "Fikapaus" (lugna taggar) för
// att vikta matchningarna mot rätt känsla, utöver den vanliga scorePlace.
function tagBonus(p, tagList){
  const hits = p.tags.filter(t => tagList.includes(t)).length;
  return Math.min(1, hits * 0.5);
}

// Lägen som inte har ett eget platssteg (Spontant, Med vänner, Fikapaus)
// behöver ändå koordinater för att kunna använda riktig Google-data.
// Detta ber om plats i bakgrunden, utan en egen skärm, med kort timeout
// så flödet aldrig känns långsammare än innan.
function quickLocation(timeoutMs = 9000){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => resolve(null),
      { timeout: timeoutMs, maximumAge: 5 * 60 * 1000 }
    );
  });
}

// Litet stjärnbetyg i matchymatchys egen stil (inte kopplat till någon
// tredjepartstjänst). Byt "rating"/"reviews" i MOCK_PLACES mot riktiga
// recensioner när ni kopplar på live-data.
function ratingRow(p){
  if(p.rating == null) return "";
  const full = Math.round(p.rating);
  const stars = "★★★★★☆☆☆☆☆".slice(5-full, 10-full);
  return `<div class="rating-row">
    <span class="rating-stars">${stars}</span>
    <span class="rating-value">${p.rating.toFixed(1)}</span>
    <span class="rating-count">(${p.reviews} recensioner)</span>
  </div>`;
}

// Bygger en Google Maps-länk för ett förslag, så hela kortet kan klickas
// för att öppna just det stället. Live-data har koordinater + place_id
// (ger en exakt träff); mock-data har ingen av delarna, så då faller vi
// tillbaka på en textsökning på namn + typ.
function mapsUrlFor(p){
  if(typeof p.lat === "number" && typeof p.lng === "number"){
    let url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.lat + "," + p.lng)}`;
    if(p.placeId) url += `&query_place_id=${encodeURIComponent(p.placeId)}`;
    return url;
  }
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.name, p.type].filter(Boolean).join(" "))}`;
}

function reasonFor(p, state){
  const parts = [];
  parts.push(Math.abs(p.price-state.budget)===0 ? "träffar er budget rakt av" : "ligger nära er budget");
  parts.push(p.dist<=state.radius ? `bara ${p.dist.toFixed(1)} km bort` : `${p.dist.toFixed(1)} km bort, strax utanför er radie`);
  parts.push(Math.abs(p.adv-state.adventure)<=1 ? "matchar hur äventyrliga ni är" : "sticker lite ut från er profil");
  const traitPart = p.trait ? ` Känt för ${p.trait}.` : "";
  const vibeHits = state.vibeTags && state.vibeTags.length ? p.tags.filter(t => state.vibeTags.includes(t)) : [];
  const vibePart = vibeHits.length ? ` Matchar er vibe (${vibeHits.join(", ")}).` : "";
  return `${parts[0].charAt(0).toUpperCase()+parts[0].slice(1)}, ${parts[1]} och ${parts[2]}.${traitPart}${vibePart}`;
}

// Ger bonuspoäng mot förslag som matchar den vibe gänget valt (eller den
// AI-tolkade egna vibe-texten) i steg 4 — ovanpå den vanliga scorePlace().
// Fungerar precis som tagBonus/DATE_BONUS_TAGS/CHILL_BONUS_TAGS men styrs
// av vad användaren faktiskt valde i vibe-steget istället för att vara
// hårdkodat per läge.
function scoreWithVibe(p, state, vibeWeight = 0.25){
  const base = scorePlace(p, state);
  if(!state.vibeTags || !state.vibeTags.length) return base;
  return base * (1 - vibeWeight) + tagBonus(p, state.vibeTags) * vibeWeight;
}

// Plockar ut de N bästa ur en redan poängsatt+sorterad lista, men hoppar
// över ställen som redan visats i det här sökpasset (state.seenNames) —
// det är det som gör att "Sök igen" ger nya alternativ istället för att
// visa exakt samma kort igen. Om för få ovisade ställen finns kvar (t.ex.
// när man klickat "Sök igen" så många gånger att alla har visats) börjar
// vi om cykeln istället för att fastna på ett tomt resultat.
function pickUnseen(sortedPlaces, state, n = 3){
  let pool = sortedPlaces.filter(p => !state.seenNames.includes(p.name));
  if(pool.length < n){
    state.seenNames = [];
    pool = sortedPlaces;
  }
  const picked = pool.slice(0, n);
  picked.forEach(p => { if(!state.seenNames.includes(p.name)) state.seenNames.push(p.name); });
  return picked;
}

async function computeMatches(state){
  const places = await PlacesProvider.getPlaces({
    coords: state.coords,
    radiusKm: state.radius,
    budget: state.budget,
    adventure: state.adventure
  });

  // Vid reglagets ändlägen filtrerar vi strikt på prisnivå istället för att
  // bara vikta den i poängen — annars skulle "över 2000 kr" ändå kunna visa
  // billiga ställen bara för att fylla ut till tre kort.
  let candidates = places;
  if(isOpenEndedLow(state.budgetAmount)){
    candidates = places.filter(p => p.price === 1);
  } else if(isOpenEndedHigh(state.budgetAmount)){
    candidates = places.filter(p => p.price === 4);
  }

  const sorted = candidates
    .map(p => ({ ...p, score: scoreWithVibe(p, state) }))
    .sort((a,b) => b.score - a.score);

  return pickUnseen(sorted, state);
}

   ========================================================================= */
const FAVORITES_KEY = 'matchymatchy_favorites';

function getFavorites(){
  try{ return JSON.parse(localStorage.getItem(FAVORITES_KEY)) || []; }
  catch(e){ return []; }
}
function saveFavorites(list){
  try{ localStorage.setItem(FAVORITES_KEY, JSON.stringify(list)); }catch(e){}
  updateFavCount();
}
function isFavorite(name){ return getFavorites().some(f => f.name === name); }
function toggleFavorite(place){
  const list = getFavorites();
  const idx = list.findIndex(f => f.name === place.name);
  if(idx >= 0) list.splice(idx, 1);
  else list.push({ name: place.name, type: place.type, tags: place.tags || [], trait: place.trait || '' });
  saveFavorites(list);
  return idx < 0; // true om den precis lades till
}
function updateFavCount(){
  if(el.favCount) el.favCount.textContent = getFavorites().length;
}

function renderFavorites(){
  el.modeTabs.style.display = 'none';
  el.steps.style.display = 'none';
  el.dataNote.textContent = '';
  el.card.style.minHeight = 'auto';
  const favorites = getFavorites();

  if(favorites.length === 0){
    el.card.innerHTML = `
      <div class="eyebrow">Favoriter</div>
      <h1>Inga sparade <em>ställen än</em></h1>
      <p class="fav-empty">Tryck på hjärtat på ett förslag för att spara det här.</p>
    `;
  } else {
    el.card.innerHTML = `
      <div class="eyebrow">Favoriter</div>
      <h1>Era <em>${favorites.length === 1 ? 'sparade ställe' : 'sparade ställen'}</em></h1>
    `;
    const frag = document.createDocumentFragment();
    favorites.forEach(f => {
      const item = document.createElement('div');
      item.className = 'fav-list-item';
      item.innerHTML = `
        <div><div class="fli-name">${f.name}</div><div class="fli-type">${f.type}</div></div>
        <button class="fav-btn active" data-remove="${f.name}" aria-label="Ta bort favorit">♥</button>
      `;
      frag.appendChild(item);
    });
    el.card.appendChild(frag);
    el.card.querySelectorAll('[data-remove]').forEach(btn => {

        saveFavorites(getFavorites().filter(f => f.name !== btn.dataset.remove));

function requestLocation(){
  const status = document.getElementById('locStatus');
  status.classList.remove('err');
  status.textContent = "Söker din plats…";
  if(!navigator.geolocation){
    status.classList.add('err');
    status.textContent = "Din enhet stödjer inte platsdelning — skriv in en adress eller ett ställe nedan istället.";
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      status.textContent = "Plats hittad ✓";
      setTimeout(() => { state.step++; render(); }, 500);
    },
    () => {
      // Går INTE vidare automatiskt här längre — annars kunde man hamna i
      // nästa steg utan riktiga koordinater, vilket gjorde att förslagen
      // tyst föll tillbaka på exempeldata med hittepå-avstånd som såg ut
      // som riktiga. Be istället om en adress, så avstånden alltid stämmer.
      status.classList.add('err');
      status.textContent = "Ingen åtkomst till din plats — skriv in en adress eller ett ställe nedan istället.";
    }
  );
}

// Låter användaren skriva in valfri plats — inte bara en gatuadress, utan
// även namngivna ställen som ett hotell, en restaurang eller ett landmärke.
// Geocoding API (adressuppslagning) förstod aldrig sånt, så vi använder
// samma Places-sökning som resten av appen bygger på, fast i textsöknings-
// läge. Visar upp till 5 träffar att välja bland, precis som Google gör.
async function searchManualLocation(query, statusEl, resultsEl){
  statusEl.classList.remove('err');
  statusEl.textContent = "Söker efter platsen…";
  resultsEl.innerHTML = '';
  try {
    const matches = await searchPlacesText(query);
    if(!matches.length){
      statusEl.classList.add('err');
      statusEl.textContent = "Hittade inget som matchar — testa ett annat namn, eller lägg till stad.";
      return;
    }
    statusEl.textContent = matches.length === 1 ? "1 träff — bekräfta genom att välja den" : `${matches.length} träffar — välj rätt ställe`;
    resultsEl.innerHTML = matches.map((m, i) => `
      <div class="choice" tabindex="0" role="button" data-i="${i}">
        <span>${m.name}</span><span class="tag">${m.address}</span>
      </div>
    `).join('');
    function pick(target){
      const m = matches[parseInt(target.dataset.i, 10)];
      state.coords = { lat: m.lat, lng: m.lng };
      statusEl.classList.remove('err');
      statusEl.textContent = `Vald plats: ${m.name} ✓`;
      resultsEl.innerHTML = '';
      setTimeout(() => { state.step++; render(); }, 350);
    }
    resultsEl.querySelectorAll('.choice').forEach(el => {
      el.addEventListener('click', () => pick(el));
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(el); }
      });
    });
  } catch(err){
    console.error("matchymatchy: platssökning misslyckades", err);
    statusEl.classList.add('err');
    statusEl.textContent = "Kunde inte söka just nu — kontrollera anslutningen och försök igen.";
  }
}

// Places Text Search (New) — samma API-familj som PlacesProvider.fetchLive
// använder för själva förslagen, men i fritextläge. Till skillnad från
// Geocoding API förstår den namngivna ställen (hotell, restauranger,
// landmärken) och inte bara gatuadresser.
async function searchPlacesText(query){
  if(!CONFIG.GOOGLE_MAPS_API_KEY) return [];
  const res = await fetch("https://places.googleapis.com/v1/places:searchText", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Goog-Api-Key": CONFIG.GOOGLE_MAPS_API_KEY,
      "X-Goog-FieldMask": "places.displayName,places.formattedAddress,places.location"
    },
    body: JSON.stringify({
      textQuery: query,
      maxResultCount: 5,
      languageCode: "sv",
      regionCode: "SE"
    })
  });
  if(!res.ok) throw new Error("Places textsökning misslyckades: " + res.status);
  const data = await res.json();
  return (data.places || [])
    .map(p => ({
      name: p.displayName?.text || "Okänt namn",
      address: p.formattedAddress || "",
      lat: p.location?.latitude,
      lng: p.location?.longitude
    }))
    .filter(p => typeof p.lat === "number" && typeof p.lng === "number");
}

// Snävare, verklighetsförankrat spann (50–1000 kr istället för 100–2000 kr)
// och brytpunkter som matchar Googles fyra prisnivåer rakt av — samma
// indelning som mapGooglePriceLevel() använder. Det gör att det spannet
// man drar in på faktiskt är det spannet förslagen hämtas ur, istället för
// att reglaget bara delade in i tredjedelar oavsett vad Google kallar dyrt.
const BUDGET_MIN = 50;
const BUDGET_MAX = 1000;
const BUDGET_BREAKPOINTS = [150, 350, 700]; // <150=nivå1, 150–350=nivå2, 350–700=nivå3, >700=nivå4

function amountToTier(amount){
  if(amount < BUDGET_BREAKPOINTS[0]) return 1;
  if(amount < BUDGET_BREAKPOINTS[1]) return 2;
  if(amount < BUDGET_BREAKPOINTS[2]) return 3;
  return 4;
}

// Vid reglagets ändlägen är det öppna intervall ("under 50 kr" / "över
// 1000 kr") snarare än en exakt nivå — det hanteras separat i computeMatches.
function isOpenEndedLow(amount){ return amount <= BUDGET_MIN; }
function isOpenEndedHigh(amount){ return amount >= BUDGET_MAX; }

function budgetValueLabel(amount){
  if(isOpenEndedLow(amount)) return "Under 50 kr";
  if(isOpenEndedHigh(amount)) return "Över 1000 kr";
  return amount + " kr";
}

function budgetNote(amount){
  if(isOpenEndedLow(amount)) return "Visar bara ställen under 50 kr";
  if(isOpenEndedHigh(amount)) return "Visar bara ställen över 700 kr";
  const labels = { 1:"€ · Prisvärt, under 150 kr", 2:"€€ · Vardagslyx, 150–350 kr", 3:"€€€ · Lite finare, 350–700 kr", 4:"€€€€ · Vi unnar oss, över 700 kr" };
  return labels[amountToTier(amount)];
}

const RADIUS_MIN = 0.5;
const RADIUS_MAX = 50;

// Svensk decimalkomma, och inga onödiga decimaler på jämna tal (t.ex. "12 km"
// istället för "12,0 km").
function formatKm(km){
  const rounded = Math.round(km * 10) / 10;
  const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1).replace('.', ',');
  return text + " km";
}

function radiusValueLabel(km){
  if(km <= RADIUS_MIN) return "Max 0,5 km";
  if(km >= RADIUS_MAX) return "Max 50 km";
  return formatKm(km);
}

   matchningslogiken redan förstår sig på. Ingen extern AI-tjänst anropas
   här (appen har ingen backend att göra det ifrån) — "analysen" är en

const VIBE_PRESETS = [

  // Mat/matlagning — generellt, plus vanliga kök/rätter, så fler texter fångas.
  { words:["mat","äta","middag","lunch","frukost","brunch","krog","restaurang","matig",
            "sushi","pizza","pasta","burgare","tacos","kebab","asiatisk","thai","indisk",
            "italiensk","mexikansk","grill","bbq","skaldjur","fisk","kött","dessert"],       tags:["Mat"],                              adventure:3 },
  // Bar/alkohol — eget spår så det går att kombinera fritt med "Mat" ovan.
  { words:["bar","alkohol","drink","drinkar","öl","vin","cocktail","cocktails","sprit",
            "pub","bryggeri","vinbar","ölhall","shots"],                                    tags:["Alkohol"],                          adventure:3 },
  // Fika/kaffe.
  { words:["fika","kaffe","bakverk","kondis","kaka","bulle","cafe","café"],                  tags:["Fika","Avslappnat"],                adventure:2 },
  { words:["barn","familj","barnvänlig","unge","barnvagn"],                                  tags:["Familjevänligt","Avslappnat"],      adventure:1 },
  { words:["utomhus","uteservering","terrass","sol","picknick"],                             tags:["Utomhus"],                          adventure:2 },
  { words:["musik","liveband","live","karaoke","konsert","dj"],                              tags:["Livemusik","Socialt"],              adventure:4 },
  { words:["sport","fotboll","match","hockey","basket"],                                     tags:["Sportbar","Socialt"],               adventure:3 }
];

// Delar upp fritexten i ord och matchar varje nyckelord mot ordgränser
// (inte bara "innehåller" på hela strängen), så kortare ord som "mat"
// eller "bar" inte råkar missa pga ordform, samtidigt som t.ex. "matcha"
// inte felaktigt triggar "mat". Om texten innehåller flera skilda begrepp
// (t.ex. "mat och bar") plockas taggar från *varje* träffad kategori upp,
// så resultatet blir en kombination — precis som en riktig tolkning skulle
// väga in båda önskemålen samtidigt.
function analyzeVibeText(text){
  const lower = text.toLowerCase();
  const tokens = lower.match(/[a-zåäö0-9]+/g) || [];
  const tags = new Set();
  let advSum = 0, advHits = 0;

  VIBE_KEYWORDS.forEach(k => {
    const hit = k.words.some(w => {
      // Flerordsfraser (t.ex. "andas ut") matchas som substräng,
      // enskilda ord matchas mot hela tokens för att undvika falska träffar.
      if(w.includes(" ")) return lower.includes(w);
      return tokens.some(t => t === w || t.startsWith(w) && w.length >= 4);
    });
    if(hit){
      k.tags.forEach(t => tags.add(t));
      advSum += k.adventure; advHits++;
    }
  });

  // Ingen känd nyckelordskategori hittades — snarare än att ge upp helt
  // (och blockera användaren) gissar vi en rimlig, neutral profil utifrån
  // textens längd/ton så det alltid går att gå vidare med något resultat,
  // precis som ett resonerande verktyg skulle göra en bästa gissning.
  if(!advHits){
    return { tags: [], adventure: 3, understood:false };
  }
  return {
    tags: Array.from(tags),
    adventure: Math.min(5, Math.max(1, Math.round(advSum / advHits))),
    understood:true
  };
}

  // Tolkar fritexten och går direkt vidare till matchningen — man ska inte
  // behöva klicka en gång till på knappen längre ner. Analysen blockerar
  // aldrig: hittas inga kända nyckelord (t.ex. helt fritt formulerad text)
  // sparas texten ändå och vi går vidare med en neutral profil, precis som
  // ett resonerande verktyg skulle göra en bästa gissning istället för att
  // ge upp.
  function runAnalysisAndSearch(){
    const text = input.value.trim();
    if(!text){ input.focus(); return; }
    const analysis = analyzeVibeText(text);
    state.vibeSource = 'custom';
    state.vibeId = null;
    state.customVibeText = text;
    state.vibeLabel = text;
    state.vibeTags = analysis.tags;
    state.adventure = analysis.adventure;
    state.step++;
    render();
  }

  document.getElementById('vibeAnalyzeBtn').addEventListener('click', runAnalysisAndSearch);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); runAnalysisAndSearch(); } });
  nextBtn.addEventListener('click', () => { state.step++; render(); });
}

// Om det finns ett giltigt val att gå vidare med — antingen en vald preset,
// eller egen text som sparats (oavsett om analysen hittade några nyckenord
// eller inte). Att kräva träffade nyckelord här var buggen som gjorde att
// knappen förblev inaktiv för fritext som inte kändes igen.
function hasVibeSelection(state){
  return state.vibeSource === 'preset' || (state.vibeSource === 'custom' && !!state.customVibeText);
}

function vibeCustomStatusText(text, tags){
  return tags && tags.length
    ? `Er vibe: "${text}" — vi väger in ${tags.join(", ")}.`
    : `Er vibe: "${text}" — inga tydliga nyckelord hittades, men vi sparar den och söker ändå.`;
}

// Delas av alla lägen — bara meddelandena och matchningsfunktionen skiljer.
function renderLoadingGeneric(flow){
  const messages = flow.loadingMessages(state);
  el.card.innerHTML = `
    <div class="eyebrow">${flow.loadingEyebrow || "Matchar"}</div>
    <h1>${flow.loadingTitle || "Scannar <em>omgivningen…</em>"}</h1>
    <div class="loading-wrap">
      <div class="scan"></div>
      <div class="loading-text" id="loadText">${messages[0]}</div>
    </div>
  `;
  let i = 0;
  const loadTextEl = document.getElementById('loadText');
  const messageTimer = setInterval(() => {
    i++;
    if(i < messages.length) loadTextEl.textContent = messages[i];
  }, 550);

  // Kör den faktiska (idag: fejkade, senare: riktiga) matchningen medan
  // animationen snurrar, och väntar in båda innan vi visar resultat.
  const minDisplayTime = new Promise(r => setTimeout(r, flow.minDelay || 2200));
  Promise.all([flow.matcher(state), minDisplayTime])
    .then(([result]) => {
      clearInterval(messageTimer);
      state.step++;
      flow.resultRenderer(result);
    })
    .catch((err) => {
      clearInterval(messageTimer);
      console.error("matchymatchy: kunde inte hämta matchningar", err);
      renderError();
    });
}

function renderError(){
  el.card.innerHTML = `
    <div class="eyebrow">Något gick fel</div>
    <h1>Kunde inte <em>hitta matchningar</em></h1>
    <p class="error">Vi kunde inte scanna omgivningen just nu. Kontrollera anslutningen och försök igen.</p>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="retryBtn">Försök igen</button>
  `;
  document.getElementById('retryBtn').addEventListener('click', () => switchMode(state.mode));
}

function renderResults(matches){
  el.card.style.minHeight = 'auto';

  if(matches.length === 0){
    el.card.innerHTML = `
      <div class="eyebrow">Inga träffar</div>
      <h1>Inget som <em>matchar riktigt</em></h1>
      <p class="lead">Ingenting i vårt urval låg i det spannet just nu. Prova igen med andra val.</p>
    `;
    const retryBtn = document.createElement('button');
    retryBtn.className = 'btn btn-primary';
    retryBtn.textContent = 'Prova igen';
    retryBtn.addEventListener('click', () => switchMode(state.mode));
    el.card.appendChild(retryBtn);
    return;
  }

  const modeLead = {
    now: "Baserat på budget, avstånd och er vibe — här är vad matchymatchy hittade åt er.",
    spontaneous: "Vi slumpade fram budget, sträcka och stämning å era vägnar — här är vad vi hittade.",
    group: `Vi vägde ihop smaken hos ${state.groupSize || 1} ${state.groupSize === 1 ? 'person' : 'personer'} och hittade det här.`,
    date: "Vi viktade upp mysiga, romantiska ställen — här är vad som passade bäst för er två.",
    fika: "En snabb, lugn paus nära er — inget krångel."
  };

  el.card.innerHTML = `
    <div class="eyebrow">Klart</div>
    <h1>Era <em>${matches.length === 3 ? '3 matchningar' : matches.length + (matches.length===1 ? ' matchning' : ' matchningar')}</em></h1>
    <p class="lead">${modeLead[state.mode] || modeLead.now}</p>
  `;
  const frag = document.createDocumentFragment();
  matches.forEach(p => {
    const pct = Math.round(60 + p.score * 38);
    const card = document.createElement('div');
    card.className = 'result-card clickable';
    card.tabIndex = 0;
    card.setAttribute('role', 'link');
    card.setAttribute('aria-label', `Öppna ${p.name} i Google Maps`);
    card.innerHTML = `
      <div class="result-top">
        <div>
          <div class="result-name">${p.name}</div>
          <div class="result-type">${p.type}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="match-badge">${pct}% match</div>
          <button class="fav-btn ${isFavorite(p.name) ? 'active' : ''}" data-fav="${p.name}" aria-label="Spara favorit">♥</button>
        </div>
      </div>
      <div class="result-why">${reasonFor(p, state)}</div>
      <div class="chips">${p.tags.map((t,i) => `<span class="chip ${i===1?'mint':''}">${t}</span>`).join('')}</div>
      ${ratingRow(p)}
      <div class="maps-hint">📍 Öppna i Google Maps ↗</div>
    `;
    const openInMaps = () => window.open(mapsUrlFor(p), '_blank', 'noopener');
    card.addEventListener('click', (e) => { if(e.target.closest('[data-fav]')) return; openInMaps(); });
    card.addEventListener('keydown', (e) => {
      if((e.key === 'Enter' || e.key === ' ') && !e.target.closest('[data-fav]')){
        e.preventDefault(); openInMaps();
      }
    });
    frag.appendChild(card);
  });
  el.card.appendChild(frag);
  el.card.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const place = matches.find(m => m.name === btn.dataset.fav);
      const added = toggleFavorite(place);
      btn.classList.toggle('active', added);
    });
  });

  const searchAgainBtn = document.createElement('button');
  searchAgainBtn.className = 'btn btn-primary';
  searchAgainBtn.style.marginTop = '4px';
  searchAgainBtn.textContent = 'Sök igen med samma val';
  searchAgainBtn.addEventListener('click', () => render());
  el.card.appendChild(searchAgainBtn);

  const restartBtn = document.createElement('button');
  restartBtn.className = 'btn btn-ghost';
  restartBtn.style.marginTop = '4px';
  restartBtn.textContent = state.mode === 'spontaneous' ? 'Överraska oss igen' : 'Gör om matchningen';
  restartBtn.addEventListener('click', () => switchMode(state.mode));
  el.card.appendChild(restartBtn);
}

/* =========================================================================
   LÄGE: SPONTANT
   Inga frågor alls — ett enda tryck slumpar fram budget/sträcka/stämning
   och kör direkt till resultat. Återanvänder computeMatches/renderResults.
   ========================================================================= */
function renderSpontaneousIntro(){
  el.card.innerHTML = `
    <div class="eyebrow">Spontant</div>
    <h1>Inga frågor. <em>Bara ett förslag.</em></h1>
    <p class="lead">Vi slumpar fram budget, sträcka och stämning åt er och hittar tre ställen direkt — inget quiz.</p>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="surpriseBtn">Överraska oss</button>
  `;
  document.getElementById('surpriseBtn').addEventListener('click', () => { state.step++; render(); });
}

async function computeSpontaneousMatches(state){
  const budgetTiers = [1,2,3,4];
  const budgetAmounts = { 1:100, 2:250, 3:500, 4:900 };
  const radii = [1, 1.5, 2, 3, 4];
  const adventures = [1, 3, 5];

  state.budget = budgetTiers[Math.floor(Math.random()*budgetTiers.length)];
  state.budgetAmount = budgetAmounts[state.budget];
  state.radius = radii[Math.floor(Math.random()*radii.length)];
  state.adventure = adventures[Math.floor(Math.random()*adventures.length)];
  if(!state.coords) state.coords = await quickLocation();

  return computeMatches(state);
}

/* =========================================================================
   LÄGE: MED VÄNNER
   Lägg till allas budget + stämning en i taget, vi räknar ut ett snitt
   (kompromiss) och kör det snittet genom samma computeMatches som vanligt.
   ========================================================================= */
function peopleRowHtml(p, i){
  return `<div class="people-row">
    <div><div>${p.name}</div><div class="meta">${budgetLabelShort(p.budget)} · ${advLabelShort(p.adventure)}</div></div>
    <span class="remove" data-remove="${i}">Ta bort</span>
  </div>`;
}
function budgetLabelShort(v){ return {1:"€",2:"€€",3:"€€€",4:"€€€€"}[v] || "–"; }
function advLabelShort(v){ return {1:"Säkert",3:"Lite nytt",5:"Överraska"}[v] || "–"; }

function renderGroupPeople(){
  const draft = state.groupDraft;
  el.card.innerHTML = `
    <div class="eyebrow">Med vänner</div>
    <h1>Vilka är <em>med ikväll?</em></h1>
    <p class="lead">Lägg till alla i gänget, en i taget — vi väger ihop allas smak till en gemensam matchning.</p>

    <div id="peopleList">
      ${state.people.length ? state.people.map(peopleRowHtml).join('') : `<p class="people-empty">Ingen tillagd än.</p>`}
    </div>

    <div class="field-label">Ny person · budget</div>
    <div class="pill-row" id="draftBudget">
      ${[{v:1,l:"€"},{v:2,l:"€€"},{v:3,l:"€€€"},{v:4,l:"€€€€"}].map(o=>`<div class="pill${draft.budget===o.v?' selected':''}" data-v="${o.v}">${o.l}</div>`).join('')}
    </div>
    <div class="field-label">Stämning</div>
    <div class="pill-row" id="draftAdv">
      ${[{v:1,l:"Säkert"},{v:3,l:"Lite nytt"},{v:5,l:"Överraska"}].map(o=>`<div class="pill${draft.adventure===o.v?' selected':''}" data-v="${o.v}">${o.l}</div>`).join('')}
    </div>
    <button class="btn btn-ghost" id="addPersonBtn" style="border:1px solid var(--line); border-radius:12px; margin-top:8px;" ${draft.budget && draft.adventure ? '' : 'disabled'}>+ Lägg till person</button>

    <div class="spacer"></div>
    <button class="btn btn-primary" id="groupNextBtn" ${state.people.length ? '' : 'disabled'}>Hitta matchningar för gänget</button>
  `;

  el.card.querySelectorAll('#peopleList [data-remove]').forEach(btn=>{
    btn.addEventListener('click', () => {
      state.people.splice(parseInt(btn.dataset.remove, 10), 1);
      render();
    });
  });
  el.card.querySelectorAll('#draftBudget .pill').forEach(p=>{
    p.addEventListener('click', () => { state.groupDraft.budget = parseInt(p.dataset.v, 10); render(); });
  });
  el.card.querySelectorAll('#draftAdv .pill').forEach(p=>{
    p.addEventListener('click', () => { state.groupDraft.adventure = parseInt(p.dataset.v, 10); render(); });
  });
  const addBtn = document.getElementById('addPersonBtn');
  if(addBtn){
    addBtn.addEventListener('click', () => {
      state.people.push({ name: `Person ${state.people.length+1}`, budget: state.groupDraft.budget, adventure: state.groupDraft.adventure });
      state.groupDraft = { budget: null, adventure: null };
      render();
    });
  }
  const nextBtn = document.getElementById('groupNextBtn');
  if(!nextBtn.disabled){
    nextBtn.addEventListener('click', () => { state.step++; render(); });
  }
}

async function computeGroupMatches(state){
  const people = state.people.length ? state.people : [{ name:"Du", budget: state.budget || 2, adventure: state.adventure || 3 }];
  const avg = (key) => people.reduce((sum,p)=>sum+p[key],0) / people.length;

  state.budget = Math.min(4, Math.max(1, Math.round(avg('budget'))));
  state.adventure = Math.min(5, Math.max(1, Math.round(avg('adventure'))));
  state.budgetAmount = { 1:100, 2:250, 3:500, 4:900 }[state.budget];
  state.radius = state.radius || 3;
  state.groupSize = people.length;
  if(!state.coords) state.coords = await quickLocation();

  return computeMatches(state);
}

/* =========================================================================
   LÄGE: IKVÄLL
   Samma quiz som "Nu", men resultatet blir en kvällsplan i tre steg
   (förfest → middag → efterfest) istället för tre fristående alternativ.
   ========================================================================= */
async function computeEveningPlan(state){
  const places = await PlacesProvider.getPlaces({
    coords: state.coords, radiusKm: state.radius, budget: state.budget, adventure: state.adventure
  });
  const bestInSlot = (slot) => {
    const sorted = places
      .filter(p => p.slot === slot)
      .map(p => ({ ...p, score: scoreWithVibe(p, state) }))
      .sort((a,b) => b.score - a.score);
    return pickUnseen(sorted, state, 1)[0] || null;
  };

  return {
    early: { time:"17:30", label:"Förfest", place: bestInSlot('early') },
    main:  { time:"19:30", label:"Middag",  place: bestInSlot('main') },
    late:  { time:"22:00", label:"Efterfest", place: bestInSlot('late') }
  };
}

function renderEveningPlan(plan){
  el.card.style.minHeight = 'auto';
  const items = [plan.early, plan.main, plan.late].filter(s => s.place);

  if(items.length === 0){
    el.card.innerHTML = `
      <div class="eyebrow">Inga träffar</div>
      <h1>Inget som <em>matchar riktigt</em></h1>
      <p class="lead">Prova en bredare budget eller större sträcka.</p>
    `;
    const retryBtn = document.createElement('button');
    retryBtn.className = 'btn btn-primary';
    retryBtn.textContent = 'Prova igen';
    retryBtn.addEventListener('click', () => switchMode('tonight'));
    el.card.appendChild(retryBtn);
    return;
  }

  el.card.innerHTML = `
    <div class="eyebrow">Klart</div>
    <h1>Er <em>kväll</em>, planerad</h1>
    <p class="lead">Från förfest till efterfest — tre ställen som passar er stämning och budget ikväll.</p>
    <div class="timeline" id="timelineWrap"></div>
  `;
  const wrap = document.getElementById('timelineWrap');
  items.forEach(item => {
    const p = item.place;
    const row = document.createElement('div');
    row.className = 'timeline-item';
    row.innerHTML = `
      <div class="timeline-track"><div class="timeline-dot"></div><div class="timeline-line"></div></div>
      <div class="timeline-content clickable" tabindex="0" role="link" aria-label="Öppna ${p.name} i Google Maps">
        <div class="timeline-time">${item.time} · ${item.label}</div>
        <div class="result-name">${p.name}</div>
        <div class="result-type">${p.type}</div>
        <div class="result-why">${reasonFor(p, state)}</div>
        <div class="chips">${p.tags.map((t,i)=>`<span class="chip ${i===1?'mint':''}">${t}</span>`).join('')}</div>
        ${ratingRow(p)}
        <div class="maps-hint">📍 Öppna i Google Maps ↗</div>
      </div>
    `;
    const content = row.querySelector('.timeline-content');
    const openInMaps = () => window.open(mapsUrlFor(p), '_blank', 'noopener');
    content.addEventListener('click', openInMaps);
    content.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openInMaps(); }
    });
    wrap.appendChild(row);
  });

  const searchAgainBtn = document.createElement('button');
  searchAgainBtn.className = 'btn btn-primary';
  searchAgainBtn.style.marginTop = '10px';
  searchAgainBtn.textContent = 'Sök igen med samma val';
  searchAgainBtn.addEventListener('click', () => render());
  el.card.appendChild(searchAgainBtn);

  const restartBtn = document.createElement('button');
  restartBtn.className = 'btn btn-ghost';
  restartBtn.style.marginTop = '6px';
  restartBtn.textContent = 'Gör om planen';
  restartBtn.addEventListener('click', () => switchMode('tonight'));
  el.card.appendChild(restartBtn);
}

/* =========================================================================
   LÄGE: DEJT
   Samma quiz som "Nu" (location, budget, radie, äventyr), men matchningen
   viktar upp romantiska/mysiga taggar utöver den vanliga poängen.
   ========================================================================= */
const DATE_BONUS_TAGS = ["Romantiskt", "Mysigt", "Datevänligt", "Utsikt"];

async function computeDateMatches(state){
  const places = await PlacesProvider.getPlaces({
    coords: state.coords, radiusKm: state.radius, budget: state.budget, adventure: state.adventure
  });
  const bonusTags = [...DATE_BONUS_TAGS, ...(state.vibeTags || [])];
  const sorted = places
    .map(p => ({ ...p, score: scorePlace(p, state) * 0.75 + tagBonus(p, bonusTags) * 0.25 }))
    .sort((a,b) => b.score - a.score);
  return pickUnseen(sorted, state);
}

/* =========================================================================
   LÄGE: FIKAPAUS
   Det snabbaste "riktiga" läget efter Spontant — en enda fråga (budget),
   resten sätts till lugna standardvärden: kort radie, låg äventyrsnivå,
   och matchningen viktar upp avslappnade/lugna taggar.
   ========================================================================= */
const CHILL_BONUS_TAGS = ["Avslappnat", "Lugnt", "Prisvärt"];

function renderFikaIntro(){
  el.card.innerHTML = `
    <div class="eyebrow">Fikapaus</div>
    <h1>Snabb <em>paus?</em></h1>
    <p class="lead">En fråga, så hittar vi ett lugnt, nära ställe att andas ut på.</p>
    <div class="field-label">Budget</div>
    <div class="pill-row" id="fikaBudget">
      ${[{v:1,l:"€"},{v:2,l:"€€"},{v:3,l:"€€€"},{v:4,l:"€€€€"}].map(o=>`<div class="pill${state.budget===o.v?' selected':''}" data-v="${o.v}">${o.l}</div>`).join('')}
    </div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="fikaNextBtn" ${state.budget ? '' : 'disabled'}>Hitta ett ställe</button>
  `;
  el.card.querySelectorAll('#fikaBudget .pill').forEach(pill=>{
    pill.addEventListener('click', () => { state.budget = parseInt(pill.dataset.v, 10); render(); });
  });
  const nextBtn = document.getElementById('fikaNextBtn');
  if(!nextBtn.disabled){
    nextBtn.addEventListener('click', () => {
      state.radius = 1.5;
      state.adventure = 1;
      state.budgetAmount = { 1:100, 2:250, 3:500, 4:900 }[state.budget];
      state.step++;
      render();
    });
  }
}

async function computeFikaMatches(state){
  if(!state.coords) state.coords = await quickLocation();
  const places = await PlacesProvider.getPlaces({
    coords: state.coords, radiusKm: state.radius, budget: state.budget, adventure: state.adventure
  });
  const bonusTags = [...CHILL_BONUS_TAGS, ...(state.vibeTags || [])];
  const sorted = places
    .map(p => ({ ...p, score: scorePlace(p, state) * 0.7 + tagBonus(p, bonusTags) * 0.3 }))
    .sort((a,b) => b.score - a.score);
  return pickUnseen(sorted, state);
}

/* =========================================================================
   FLÖDEN
   Kopplar ihop varje läge med sina steg, sin matchningsfunktion och sitt
   resultat. Måste sättas efter att alla funktioner ovan är deklarerade,
   men eftersom de är function-deklarationer (hissade) spelar placeringen
   ingen roll — det här är bara ihopkopplingen.
   ========================================================================= */
FLOWS = {
  now: {
    steps: [renderLocation, renderBudget, renderRadius, renderVibe],
    matcher: computeMatches,
    resultRenderer: renderResults,
    loadingMessages: (s) => [
      `Analyserar platser inom ${formatKm(s.radius)}…`,
      "Jämför med er budget…",
      "Väger in er vibe…",
      "Rankar bästa matchningarna…"
    ]
  },
  tonight: {
    steps: [renderLocation, renderBudget, renderRadius, renderVibe],
    matcher: computeEveningPlan,
    resultRenderer: renderEveningPlan,
    loadingEyebrow: "Planerar",
    loadingTitle: "Bygger <em>kvällsplanen…</em>",
    loadingMessages: () => [
      "Kollar vad som är öppet ikväll…",
      "Väljer förfest, middag och efterfest…",
      "Sätter ihop rutten…",
      "Klar strax…"
    ]
  },
  spontaneous: {
    steps: [renderSpontaneousIntro],
    matcher: computeSpontaneousMatches,
    resultRenderer: renderResults,
    minDelay: 1400,
    loadingMessages: () => ["Slumpar fram något bra…", "Dubbelkollar att det passar…", "Klart snart…"]
  },
  group: {
    steps: [renderGroupPeople],
    matcher: computeGroupMatches,
    resultRenderer: renderResults,
    loadingMessages: () => ["Väger ihop allas önskemål…", "Hittar en kompromiss alla gillar…", "Rankar bästa matchningarna…"]
  },
  date: {
    steps: [renderLocation, renderBudget, renderRadius, renderVibe],
    matcher: computeDateMatches,
    resultRenderer: renderResults,
    loadingMessages: (s) => [
      `Analyserar platser inom ${formatKm(s.radius)}…`,
      "Letar efter mysiga hörn…",
      "Väger in er vibe…",
      "Rankar bästa dejtställena…"
    ]
  },
  fika: {
    steps: [renderFikaIntro],
    matcher: computeFikaMatches,
    resultRenderer: renderResults,
    minDelay: 1200,
    loadingMessages: () => ["Letar efter ett lugnt hörn…", "Kollar vad som är öppet nu…", "Klart snart…"]
  }
};

render();
</script>
